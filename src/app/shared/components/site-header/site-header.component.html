<header class="sticky top-0 z-50 border-b border-line/70 bg-paper/90 backdrop-blur-xl">
  <div class="site-container flex h-[78px] items-center justify-between gap-6">
    <a class="shrink-0" href="#acasa" aria-label="Ursitoarele Fermecătoare — acasă" (click)="closeMenu()"><img class="w-40 sm:w-[200px]" src="/assets/logo-horizontal.png" alt="Ursitoarele Fermecătoare" width="200" height="64" /></a>
    <button class="grid size-11 place-items-center rounded-full text-2xl text-plum md:hidden" type="button" [attr.aria-label]="menuOpen() ? 'Închide meniul' : 'Deschide meniul'" [attr.aria-expanded]="menuOpen()" aria-controls="primary-navigation" (click)="menuOpen.update((open) => !open)">{{ menuOpen() ? '×' : '☰' }}</button>
    <nav id="primary-navigation" aria-label="Navigare principală" class="absolute left-0 right-0 top-[78px] flex-col gap-2 border-b border-line bg-paper px-6 py-5 shadow-lg md:static md:flex md:flex-row md:items-center md:gap-7 md:border-0 md:bg-transparent md:p-0 md:shadow-none" [class.flex]="menuOpen()" [class.hidden]="!menuOpen()">
      <a class="py-2 text-sm font-semibold text-muted transition hover:text-plum md:py-0" href="#poveste" (click)="closeMenu()">Povestea noastră</a>
      <a class="py-2 text-sm font-semibold text-muted transition hover:text-plum md:py-0" href="#experiente" (click)="closeMenu()">Experiențe</a>
      <a class="py-2 text-sm font-semibold text-muted transition hover:text-plum md:py-0" href="#pachete" (click)="closeMenu()">Pachete 2026</a>
      <a class="py-2 text-sm font-semibold text-muted transition hover:text-plum md:py-0" href="#valori" (click)="closeMenu()">Valorile noastre</a>
      <a class="rounded-full bg-plum/10 px-5 py-3 text-center text-sm font-bold text-plum transition hover:bg-plum hover:text-white md:py-2.5" href="#pachete" (click)="closeMenu()">Hai să alegem magia ↗</a>
    </nav>
  </div>
</header>
