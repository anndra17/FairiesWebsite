<footer class="bg-plum-dark py-10 text-white/80 sm:py-12">
  <div class="site-container">
    <div class="grid gap-8 border-b border-white/15 pb-8 sm:grid-cols-2 sm:items-start">
      <div class="text-center">
        <h2 class="font-display text-2xl text-white">{{ content.footer.contactHeading }}</h2>
        <div class="mt-4 flex flex-wrap items-center justify-center gap-x-5 gap-y-3">
          @if (phoneHref) {
            <a class="inline-flex size-11 items-center justify-center rounded-full border border-white/20 text-white transition hover:border-rose-light hover:bg-white/10 hover:text-rose-light focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-rose-light" [href]="phoneHref" [attr.aria-label]="content.footer.phoneLabel">
              <svg class="size-5 fill-current" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 2.8 9.2 2.2c.7-.2 1.4.2 1.6.9l1.1 3.4c.2.6 0 1.2-.5 1.6l-1.8 1.4a14.3 14.3 0 0 0 4.9 4.9l1.4-1.8c.4-.5 1-.7 1.6-.5l3.4 1.1c.7.2 1.1.9.9 1.6l-.6 2.6c-.2.8-.9 1.3-1.7 1.3C10.3 18.7 5.3 13.7 5.3 7c0-.8.5-1.5 1.3-1.7Z" transform="rotate(-8 12 12)" /></svg>
            </a>
          }
          @for (link of socialLinks; track link.name) {
            <a class="inline-flex size-11 items-center justify-center rounded-full border border-white/20 text-white transition hover:border-rose-light hover:bg-white/10 hover:text-rose-light focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-rose-light" [href]="link.url" [attr.aria-label]="link.ariaLabel" target="_blank" rel="noopener noreferrer">
              @switch (link.name) {
                @case ('Facebook') {
                  <svg class="size-5 fill-current" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13.5 21v-8.2h2.8l.4-3.2h-3.2v-2c0-.9.3-1.5 1.6-1.5h1.7V3.2c-.3 0-1.4-.2-2.6-.2-2.6 0-4.3 1.6-4.3 4.5v2.1H7v3.2h2.9V21h3.6Z" /></svg>
                }
                @case ('Instagram') {
                  <svg class="size-5 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.5" cy="6.8" r="1" class="fill-current stroke-none" /></svg>
                }
                @case ('TikTok') {
                  <svg class="size-5 fill-current" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.6 8.5a7.4 7.4 0 0 1-4.4-1.4v7.1a5.8 5.8 0 1 1-5-5.7v3.6a2.3 2.3 0 1 0 1.5 2.1V2.5h3.5c.2 2.1 1.8 3.8 4.4 4v2Z" /></svg>
                }
              }
            </a>
          }
        </div>
      </div>
      <div class="flex flex-col items-center justify-between gap-5 text-center sm:items-end sm:text-right">
        <a class="flex items-center gap-3 text-white" routerLink="/" fragment="home" [attr.aria-label]="content.footer.brandName"><img class="size-12 rounded-full object-cover" src="/assets/logo-emblem.png" [attr.alt]="content.footer.logoAlt" width="48" height="48" /><span class="font-display text-lg">{{ content.footer.brandName }}</span></a>
        <p class="text-sm">{{ content.footer.tagline }}</p>
      </div>
    </div>
  </div>
</footer>
